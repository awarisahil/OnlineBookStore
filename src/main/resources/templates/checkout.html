<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments :: customer-nav}"></nav>

<main class="container">
    <h1 class="mb-4">Checkout</h1>

    <table class="table">
        <thead>
        <tr>
            <th>Book</th>
            <th>Quantity</th>
            <th class="text-end">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${lines}">
            <td th:text="${line.name}">Book</td>
            <td th:text="${line.quantity}">1</td>
            <td class="text-end" th:text="|₹ ${line.amount}|">₹ 0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" class="text-end">Total to pay</th>
            <th class="text-end" th:text="|₹ ${total}|">₹ 0.00</th>
        </tr>
        </tfoot>
    </table>

    <div class="alert alert-info">
        This is a demo store — placing an order simulates payment. No card or payment details are collected.
    </div>

    <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/cart}" class="btn btn-link">Back to cart</a>
        <form th:action="@{/pay}" method="post">
            <button type="submit" class="btn btn-primary btn-lg">Place Order</button>
        </form>
    </div>
</main>
</body>
</html>
