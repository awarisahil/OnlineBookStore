<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Books')}"></head>
<body>
<nav th:replace="~{fragments :: customer-nav}"></nav>

<main class="container">
    <h1 class="mb-4">Available Books</h1>

    <div th:replace="~{fragments :: alerts}"></div>

    <p th:if="${#lists.isEmpty(books)}" class="text-muted">No books available right now — please check back later.</p>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" th:each="book : ${books}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${book.name}">Book name</h5>
                    <h6 class="card-subtitle mb-3 text-muted" th:text="${book.author}">Author</h6>
                    <p class="card-text">
                        <span th:replace="~{fragments :: stock-badge(${book.quantity})}"></span>
                    </p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <strong th:text="|₹ ${book.price}|">₹ 0.00</strong>
                        <form th:if="${book.quantity > 0}" th:action="@{/cart/add/{b}(b=${book.barcode})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Add to cart</button>
                        </form>
                        <button th:unless="${book.quantity > 0}" type="button" class="btn btn-secondary btn-sm" disabled>
                            Add to cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
