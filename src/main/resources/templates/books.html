<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Browse')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
        <div>
            <h1 class="page-heading mb-1">Browse the shelves</h1>
            <p class="text-muted mb-0" th:text="|${#lists.size(books)} books available|">15 books available</p>
        </div>
        <form th:action="@{/books}" method="get" class="d-flex" role="search" style="min-width: 280px;">
            <input type="search" name="q" class="form-control me-2" placeholder="Search title or author"
                   th:value="${q}">
            <button type="submit" class="btn btn-outline-primary">Search</button>
            <a th:if="${q != null and !#strings.isEmpty(q)}" class="btn btn-link" th:href="@{/books}">Clear</a>
        </form>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <p th:if="${#lists.isEmpty(books)}" class="text-muted">No books match your search — try another term.</p>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="book : ${books}">
            <div class="card book-card h-100">
                <div class="p-3 pb-0">
                    <div th:replace="~{fragments :: cover(${book}, '')}"></div>
                </div>
                <div class="card-body d-flex flex-column pt-3">
                    <h2 class="card-title h6" th:text="${book.name}">Book name</h2>
                    <p class="card-subtitle small text-muted mb-2" th:text="${book.author}">Author</p>
                    <p class="mb-2">
                        <span th:replace="~{fragments :: stock-badge(${book.quantity})}"></span>
                    </p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <strong class="fs-5" th:text="|₹ ${book.price}|">₹ 0.00</strong>
                        <form th:if="${book.quantity > 0}" th:action="@{/cart/add/{b}(b=${book.barcode})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Add to cart</button>
                        </form>
                        <button th:unless="${book.quantity > 0}" type="button" class="btn btn-secondary btn-sm" disabled>
                            Sold out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
