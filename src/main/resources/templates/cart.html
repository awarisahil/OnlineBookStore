<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container">
    <h1 class="page-heading mb-4">Your cart</h1>

    <div th:replace="~{fragments :: alerts}"></div>

    <div th:if="${#lists.isEmpty(lines)}" class="alert alert-info">
        Your cart is empty. <a th:href="@{/books}">Browse the shelves</a>.
    </div>

    <th:block th:unless="${#lists.isEmpty(lines)}">
        <div class="card book-card mb-4">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Book</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th class="text-end">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="line : ${lines}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div class="book-cover cover-sm"
                                 th:with="p=${T(com.onlinebookstore.util.BookCovers).palette(line.barcode)}"
                                 th:style="|background-image: linear-gradient(150deg, ${p.c1}, ${p.c2})|">
                                <span class="cover-title" th:text="${line.name}">Book</span>
                                <span class="cover-author"></span>
                            </div>
                            <span th:text="${line.name}">Book</span>
                        </div>
                    </td>
                    <td th:text="|₹ ${line.price}|">₹ 0.00</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <form th:action="@{/cart/dec/{b}(b=${line.barcode})}" method="post">
                                <button type="submit" class="btn btn-outline-danger btn-sm">&minus;</button>
                            </form>
                            <span th:text="${line.quantity}">1</span>
                            <form th:action="@{/cart/inc/{b}(b=${line.barcode})}" method="post">
                                <button type="submit" class="btn btn-outline-success btn-sm">+</button>
                            </form>
                        </div>
                    </td>
                    <td class="text-end" th:text="|₹ ${line.amount}|">₹ 0.00</td>
                </tr>
                </tbody>
                <tfoot class="table-group-divider">
                <tr>
                    <th colspan="3" class="text-end">Total</th>
                    <th class="text-end" th:text="|₹ ${total}|">₹ 0.00</th>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="text-end">
            <form th:action="@{/checkout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-primary btn-lg">Proceed to Checkout</button>
            </form>
        </div>
    </th:block>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
