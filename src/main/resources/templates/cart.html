<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments :: customer-nav}"></nav>

<main class="container">
    <h1 class="mb-4">Shopping Cart</h1>

    <div th:replace="~{fragments :: alerts}"></div>

    <div th:if="${#lists.isEmpty(lines)}" class="alert alert-info">
        Your cart is empty. <a th:href="@{/books}">Browse the catalog</a>.
    </div>

    <th:block th:unless="${#lists.isEmpty(lines)}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th>Quantity</th>
                <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${lines}">
                <td th:text="${line.name}">Book</td>
                <td th:text="|₹ ${line.price}|">₹ 0.00</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <form th:action="@{/cart/dec/{b}(b=${line.barcode})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">&minus;</button>
                        </form>
                        <span th:text="${line.quantity}">1</span>
                        <form th:action="@{/cart/inc/{b}(b=${line.barcode})}" method="post">
                            <button type="submit" class="btn btn-outline-success btn-sm">+</button>
                        </form>
                    </div>
                </td>
                <td class="text-end" th:text="|₹ ${line.amount}|">₹ 0.00</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="text-end">Total</th>
                <th class="text-end" th:text="|₹ ${total}|">₹ 0.00</th>
            </tr>
            </tfoot>
        </table>

        <div class="text-end">
            <form th:action="@{/checkout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-primary">Proceed to Checkout</button>
            </form>
        </div>
    </th:block>
</main>
</body>
</html>
