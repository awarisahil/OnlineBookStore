<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container" style="max-width: 640px;">
    <h1 class="page-heading mb-4">Your profile</h1>
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card card-body mb-4">
        <h2 class="h5">Contact details</h2>
        <p class="small text-muted">Used as the delivery address for new orders.</p>
        <form th:action="@{/profile}" method="post" th:object="${form}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First name</label>
                    <input type="text" th:field="*{firstName}" class="form-control"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last name</label>
                    <input type="text" th:field="*{lastName}" class="form-control"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea th:field="*{address}" rows="3" class="form-control"
                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{address}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
    </div>

    <div class="card card-body">
        <h2 class="h5">Change password</h2>
        <form th:action="@{/profile/password}" method="post">
            <div class="mb-3">
                <label class="form-label">Current password</label>
                <input type="password" name="currentPassword" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New password</label>
                <input type="password" name="newPassword" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-outline-primary">Change password</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
