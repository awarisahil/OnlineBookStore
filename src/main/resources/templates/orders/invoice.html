<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Invoice')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h1 class="mb-0">Invoice</h1>
        <button onclick="window.print()" class="btn btn-primary">Print</button>
    </div>

    <div class="card card-body">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-4">
            <div>
                <span class="brand-text fs-4">OnlineBookStore</span>
                <p class="small text-muted mb-0">A cozy little demo bookstore</p>
            </div>
            <div class="text-end small">
                <p class="mb-0">Invoice for order #<span th:text="${order.id}">1</span></p>
                <p class="mb-0" th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy, HH:mm')}">date</p>
                <p class="mb-0" th:if="${order.status.name() == 'CANCELLED'}">CANCELLED</p>
            </div>
        </div>

        <p class="small mb-4">
            <strong>Bill to:</strong> <span th:text="${order.customer.getFullName()}">Reader</span> ·
            <span th:text="${order.customer.email}">reader@example.com</span><br>
            <span th:text="${order.shippingAddress}">Address</span>
        </p>

        <table class="table">
            <thead>
            <tr>
                <th>Book</th>
                <th>Qty</th>
                <th class="text-end">Price</th>
                <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.name}">Book</td>
                <td th:text="${item.quantity}">1</td>
                <td class="text-end" th:text="|₹ ${item.price}|">₹ 0.00</td>
                <td class="text-end" th:text="|₹ ${item.amount}|">₹ 0.00</td>
            </tr>
            </tbody>
            <tfoot>
            <tr th:if="${order.discount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                <th colspan="3" class="text-end">Subtotal</th>
                <th class="text-end" th:text="|₹ ${order.total.add(order.discount)}|">₹ 0.00</th>
            </tr>
            <tr th:if="${order.discount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                <th colspan="3" class="text-end" th:text="|Promo ${order.promoCode}|">Promo</th>
                <th class="text-end" th:text="|- ₹ ${order.discount}|">- ₹ 0.00</th>
            </tr>
            <tr>
                <th colspan="3" class="text-end">Total</th>
                <th class="text-end" th:text="|₹ ${order.total}|">₹ 0.00</th>
            </tr>
            </tfoot>
        </table>

        <p class="small text-muted mb-0">This is a simulated invoice — no payment was processed.</p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
