<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Orders')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container">
    <h1 class="mb-4">My Orders</h1>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        No orders yet. <a th:href="@{/books}">Browse the catalog</a>.
    </div>

    <table class="table" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>Order #</th>
            <th>Placed</th>
            <th class="text-end">Total</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy, HH:mm')}">date</td>
            <td class="text-end" th:text="|₹ ${order.total}|">₹ 0.00</td>
            <td class="text-end">
                <a class="btn btn-outline-primary btn-sm" th:href="@{/orders/{id}(id=${order.id})}">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
