<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order detail')}"></head>
<body>
<nav th:replace="~{fragments :: customer-nav}"></nav>

<main class="container">
    <h1 class="mb-1" th:text="|Order #${order.id}|">Order #1</h1>
    <p class="text-muted">
        Placed on <span th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy, HH:mm')}">date</span>
    </p>

    <table class="table">
        <thead>
        <tr>
            <th>Book</th>
            <th>Quantity</th>
            <th class="text-end">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.name}">Book</td>
            <td th:text="${item.quantity}">1</td>
            <td class="text-end" th:text="|₹ ${item.amount}|">₹ 0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" class="text-end">Total</th>
            <th class="text-end" th:text="|₹ ${order.total}|">₹ 0.00</th>
        </tr>
        </tfoot>
    </table>

    <a th:href="@{/orders}" class="btn btn-link">Back to my orders</a>
</main>
</body>
</html>
