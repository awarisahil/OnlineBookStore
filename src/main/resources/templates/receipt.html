<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Receipt')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container">
    <h1 class="mb-4">Order placed — thank you!</h1>

    <div class="alert alert-success">Your order was placed successfully. Keep this receipt for your records.</div>

    <table class="table">
        <thead>
        <tr>
            <th>Book</th>
            <th>Quantity</th>
            <th class="text-end">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${receipt.lines}">
            <td th:text="${line.name}">Book</td>
            <td th:text="${line.quantity}">1</td>
            <td class="text-end" th:text="|₹ ${line.amount}|">₹ 0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" class="text-end">Total paid</th>
            <th class="text-end" th:text="|₹ ${receipt.total}|">₹ 0.00</th>
        </tr>
        </tfoot>
    </table>

    <p class="text-muted">
        Order #<span th:text="${receipt.orderId}">1</span> ·
        placed on <span th:text="${#temporals.format(receipt.placedAt, 'dd MMM yyyy, HH:mm')}">date</span> ·
        <a th:href="@{/orders/{id}(id=${receipt.orderId})}">view this order</a>
    </p>

    <a th:href="@{/books}" class="btn btn-primary">Continue shopping</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
