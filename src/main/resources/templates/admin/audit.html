<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments :: site-nav}"></nav>

<main class="container" style="max-width: 860px;">
    <h1 class="mb-4">Audit log</h1>
    <p class="text-muted">The last 100 admin actions, newest first.</p>

    <p th:if="${#lists.isEmpty(entries)}" class="text-muted">Nothing logged yet.</p>

    <table class="table table-sm" th:unless="${#lists.isEmpty(entries)}">
        <thead>
        <tr>
            <th>When</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Detail</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${entries}">
            <td class="text-nowrap small"
                th:text="${#temporals.format(entry.createdAt, 'dd MMM yyyy, HH:mm:ss')}">date</td>
            <td class="small" th:text="${entry.actor}">admin</td>
            <td><code th:text="${entry.actionType}">ACTION</code></td>
            <td class="small" th:text="${entry.detail}">detail</td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
