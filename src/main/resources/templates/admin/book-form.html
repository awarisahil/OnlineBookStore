<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${book.barcode == null} ? 'Add Book' : 'Edit Book')}"></head>
<body>
<nav th:replace="~{fragments :: seller-nav}"></nav>

<main class="container">
    <h1 class="mb-4" th:text="${book.barcode == null} ? 'Add Book' : 'Edit Book'">Add Book</h1>

    <form th:action="${book.barcode == null} ? @{/admin/books} : @{/admin/books/{b}(b=${book.barcode})}"
          th:object="${book}" method="post">
        <input type="hidden" th:field="*{barcode}">

        <div class="mb-3">
            <label class="form-label" for="name">Book name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="author">Author</label>
            <input type="text" class="form-control" id="author" th:field="*{author}" required>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="price">Price (₹)</label>
                <input type="number" class="form-control" id="price" th:field="*{price}"
                       step="0.01" min="0" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="quantity">Quantity in stock</label>
                <input type="number" class="form-control" id="quantity" th:field="*{quantity}"
                       step="1" min="0" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/books}" class="btn btn-link">Cancel</a>
    </form>
</main>
</body>
</html>
