<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments :: public-nav}"></nav>

<main class="container">
    <div class="form-narrow">
        <h1 class="mb-4">Log in</h1>

        <div th:if="${param.error != null}" class="alert alert-danger">Invalid email or password.</div>
        <div th:if="${param.registered != null}" class="alert alert-success">
            Registration successful — log in with your new account.
        </div>
        <div th:if="${param.logout != null}" class="alert alert-info">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Email</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <p class="mt-3">No account yet? <a th:href="@{/register}">Register</a></p>
    </div>
</main>
</body>
</html>
